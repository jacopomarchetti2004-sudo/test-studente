function rw(){
const sec=S[st.step];const il=st.step===S.length-1;
let h=sec.hint?`<div class="hint">${sec.hint}</div>`:"";
let qs=sec.questions.map(q=>{
let cmtHtml="";
if(q.type!=="textarea"){
const isOpen=st.openCmt[q.id];
const cmtVal=st.cmt[q.id]||"";
if(isOpen){
cmtHtml=`<textarea class="cmt" rows="2" id="cmt_${q.id}" placeholder="Aggiungi un commento..." oninput="ci('${q.id}',this.value)">${cmtVal}</textarea>`;
}else{
cmtHtml=cmtVal
?`<textarea class="cmt" rows="2" id="cmt_${q.id}" placeholder="Aggiungi un commento..." oninput="ci('${q.id}',this.value)">${cmtVal}</textarea>`
:`<span class="cmt-toggle" onclick="oc('${q.id}')">+ Vuoi aggiungere qualcosa?</span>`;
}
}
return`<div style="margin-bottom:24px">
<label class="qlbl">${q.text}</label>${rq(q)}${cmtHtml}</div>`;
}).join("");
ap.innerHTML=`<div class="ctn wiz">
<div style="display:flex;justify-content:space-between;margin-bottom:8px">
<span style="color:#666;font-size:13px">📝 ${st.name||"Studente"}</span>
<span style="color:#666;font-size:13px">${st.step+1}/${S.length}</span></div>
<div class="pbar-w"><div class="pbar" style="width:${((st.step+1)/S.length)*100}%"></div></div>
<div class="fi" style="margin-top:32px">
<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
<span style="font-size:32px">${sec.icon}</span>
<h2 class="stitle">${sec.title}</h2></div>${h}${qs}</div>
<div class="nav">
<button class="bbk" onclick="pv()">← Indietro</button>
${il?`<button class="bsn" id="sb" onclick="snd()">✓ Invia le risposte</button>`
:`<button class="bnx" onclick="nx()">Avanti →</button>`}</div>
<div class="et" id="et">Errore nell'invio. Riprova tra qualche secondo.</div>
</div>`;}

function rq(q){
if(q.type==="scale"){return`<div class="sr">${SL.map((l,i)=>{
const v=i+1,a=st.ans[q.id]===v,c=SC[i];
return`<button class="sb" style="${a?`border:2.5px solid ${c.b};background:${c.bg}`:""}" onclick="ss('${q.id}',${v})">
<span class="n" style="${a?`color:${c.t}`:""}">${v}</span>
<span class="l" style="${a?`color:${c.t}`:""}">${l}</span></button>`;}).join("")}</div>`;}
if(q.type==="select"){return q.options.map(o=>{const a=st.ans[q.id]===o;
return`<button class="selbtn${a?" a":""}" onclick="sl('${q.id}','${o.replace(/'/g,"\\'")}')">${o}</button>`;}).join("");}
if(q.type==="textarea"){const v=st.ans[q.id]||"";
return`<textarea class="ans" rows="3" id="ta_${q.id}" placeholder="${q.placeholder||'Scrivi qui la tua risposta...'}" oninput="ti('${q.id}',this.value)">${v}</textarea>`;}
return"";}

function rt(){
ap.innerHTML=`<div class="ty"><div style="max-width:500px">
<div style="font-size:64px;margin-bottom:24px">🎉</div>
<h1 style="font-family:'Playfair Display',serif;font-size:28px;font-weight:800;color:#4caf50;margin-bottom:16px">Grazie ${st.name||""}!</h1>
<p style="color:#aaa;font-size:16px;line-height:1.6">Le tue risposte sono state inviate con successo. Ti ricontatterò presto per capire insieme come posso aiutarti nel tuo percorso.</p>
<div style="margin-top:32px;width:60px;height:3px;background:linear-gradient(90deg,#e8a838,#4caf50);border-radius:99px;margin:32px auto 0"></div>
</div></div>`;}

function ti(id,v){st.ans[id]=v;}
function ci(id,v){st.cmt[id]=v;}
function ss(id,v){st.ans[id]=v;saveta();rp();}
function sl(id,v){st.ans[id]=v;saveta();rp();}
function oc(id){st.openCmt[id]=true;saveta();rp();setTimeout(()=>{const el=document.getElementById("cmt_"+id);if(el)el.focus();},50);}

function saveta(){
document.querySelectorAll("textarea.ans").forEach(t=>{const id=t.id.replace("ta_","");if(id)st.ans[id]=t.value;});
document.querySelectorAll("textarea.cmt").forEach(t=>{const id=t.id.replace("cmt_","");if(id)st.cmt[id]=t.value;});
}

function go(){st.name=document.getElementById("ni").value;st.step=0;rp();window.scrollTo(0,0);}
function nx(){saveta();st.step++;rp();window.scrollTo(0,0);}
function pv(){saveta();if(st.step>0)st.step--;else st.step=-1;rp();window.scrollTo(0,0);}

function gr(){
let x="QUESTIONARIO STUDENTE - "+(st.name||"Anonimo")+"\n";
x+="Data: "+new Date().toLocaleDateString("it-IT")+"\n";
x+="==================================================\n\n";
S.forEach(sec=>{
x+=sec.icon+" "+sec.title.toUpperCase()+"\n";
x+="--------------------------------------------\n";
sec.questions.forEach(q=>{
const v=st.ans[q.id];const cm=st.cmt[q.id];
if(q.type==="scale"){
const f=v||0;const b="#".repeat(f)+".".repeat(5-f);
const l=v?SL[v-1]:"(nessuna risposta)";
x+=q.text+"\n  ["+b+"] "+(v||"-")+"/5 - "+l+"\n";
}else{x+=q.text+"\n  -> "+(v||"(nessuna risposta)")+"\n";}
if(cm)x+="  Commento: "+cm+"\n";
x+="\n";
});x+="\n";});return x;}

async function snd(){
saveta();const b=document.getElementById("sb");
b.textContent="Invio in corso...";b.disabled=true;b.style.background="#555";b.style.cursor="wait";
try{await emailjs.send(C.s,C.t,{section_title:"Studente - "+(st.name||"Anonimo"),results:gr()},C.p);
st.step=S.length;rp();
}catch(e){console.error("EmailJS error:",e);
document.getElementById("et").style.display="block";
b.textContent="✓ Invia le risposte";b.disabled=false;
b.style.background="linear-gradient(135deg,#4caf50,#388e3c)";b.style.cursor="pointer";
setTimeout(()=>{document.getElementById("et").style.display="none";},4000);}}

rp();
</script>
</body>
</html>
