<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conosci il tuo studente ideale</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#e8e8e8;font-family:'DM Sans',sans-serif;min-height:100vh}
.ctn{max-width:580px;margin:0 auto;padding:32px 24px}.ctn.wiz{padding-bottom:140px}
h1.pur{font-family:'Playfair Display',serif;font-size:30px;font-weight:800;background:linear-gradient(135deg,#a855f7,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px;line-height:1.2}
h2.stitle{font-family:'Playfair Display',serif;font-size:26px;font-weight:800;color:#f0f0f0}
.sub{color:#888;font-size:15px;max-width:420px;margin:0 auto;line-height:1.6}
.pbar-w{width:100%;background:rgba(255,255,255,.08);border-radius:99px;height:6px;overflow:hidden}
.pbar{height:100%;background:linear-gradient(90deg,#c084fc,#a855f7);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.qlbl{display:block;font-size:15px;font-weight:600;color:#ddd;margin-bottom:10px;line-height:1.4}
.sr{display:flex;gap:6px;width:100%}
.sb{flex:1;padding:14px 4px 10px;border-radius:12px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .2s}
.sb .n{font-size:22px;font-weight:800;color:#555;font-family:'DM Sans',sans-serif}
.sb .l{font-size:10px;color:#666;font-family:'DM Sans',sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.selbtn{display:block;width:100%;padding:12px 18px;border-radius:12px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#ccc;cursor:pointer;text-align:left;font-size:15px;font-family:'DM Sans',sans-serif;transition:all .2s;margin-bottom:8px}
.selbtn.a{border:2px solid #a855f7;background:rgba(168,85,247,.15);color:#c084fc}
textarea.ans{width:100%;padding:16px;border-radius:12px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#e0e0e0;font-size:15px;font-family:'DM Sans',sans-serif;resize:vertical;outline:none}
textarea.ans:focus{border-color:#a855f7}
textarea.cmt{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(168,85,247,.2);background:rgba(168,85,247,.04);color:#d0c0f0;font-size:13px;font-family:'DM Sans',sans-serif;resize:vertical;outline:none;margin-top:8px}
textarea.cmt:focus{border-color:#a855f7}
.cmt-toggle{color:#a855f7;font-size:12px;cursor:pointer;margin-top:6px;display:inline-block;opacity:.7;transition:opacity .2s}
.cmt-toggle:hover{opacity:1}
input.ni{width:100%;padding:16px;border-radius:12px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#e0e0e0;font-size:16px;font-family:'DM Sans',sans-serif;outline:none}
input.ni:focus{border-color:#a855f7}
.nav{position:fixed;bottom:0;left:0;right:0;padding:16px 24px;background:linear-gradient(transparent,#0f0f0f 30%);display:flex;justify-content:space-between;align-items:center;z-index:100}
.bbk{padding:14px 28px;border-radius:12px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#ccc;cursor:pointer;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif}
.bnx{padding:14px 32px;border-radius:12px;border:none;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;cursor:pointer;font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;box-shadow:0 4px 20px rgba(168,85,247,.25)}
.bsn{padding:14px 32px;border-radius:12px;border:none;background:linear-gradient(135deg,#4caf50,#388e3c);color:#fff;cursor:pointer;font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;box-shadow:0 4px 20px rgba(76,175,80,.3)}
.bst{width:100%;padding:16px 32px;border-radius:14px;border:none;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;cursor:pointer;font-size:16px;font-weight:700;font-family:'DM Sans',sans-serif;box-shadow:0 4px 24px rgba(168,85,247,.3)}
.tag{padding:8px 14px;border-radius:99px;background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.15);color:#b388ff;font-size:13px;display:inline-block;margin:0 4px 8px 0}
.fi{animation:fu .35s ease forwards}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.et{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(239,83,80,.9);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;z-index:200;display:none}
.ty{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const C={s:"service_333vq8h",t:"template_14jkmvg",p:"Ho9TKfiAcFDFDgQhk"};
const SL=["No","Poco","Così così","Abbastanza","Sì, molto"];
const SC=[
{bg:"rgba(239,83,80,.15)",b:"#ef5350",t:"#ef5350"},
{bg:"rgba(255,167,38,.15)",b:"#ffa726",t:"#ffa726"},
{bg:"rgba(255,238,88,.12)",b:"#c9b458",t:"#c9b458"},
{bg:"rgba(102,187,106,.15)",b:"#66bb6a",t:"#66bb6a"},
{bg:"rgba(76,175,80,.2)",b:"#4caf50",t:"#4caf50"}
];

const S=[
{title:"Con chi lavori meglio",icon:"🤝",questions:[
{id:"m1",text:"Ti trovi bene a lavorare con persone giovani (14-20)?",type:"scale"},
{id:"m2",text:"Ti trovi bene con giovani adulti (20-30)?",type:"scale"},
{id:"m3",text:"Ti trovi bene con adulti (30+)?",type:"scale"},
{id:"m4",text:"Lavori bene con persone molto ambiziose?",type:"scale"},
{id:"m5",text:"Lavori bene con persone insicure che hanno bisogno di fiducia?",type:"scale"},
{id:"m6",text:"Preferisci principianti assoluti?",type:"scale"},
{id:"m7",text:"Preferisci chi ha già iniziato ma è confuso?",type:"scale"},
{id:"m8",text:"Ripensando a come eri qualche anno fa, che tipo di persona ti rivedi oggi nei tuoi studenti?",type:"textarea"},
{id:"m9",text:"Quale tipo di persona ti dà energia?",type:"textarea"},
{id:"m10",text:"Quale tipo di persona ti toglie energia?",type:"textarea"},
]},
{title:"Chi NON vuoi attirare",icon:"🚫",questions:[
{id:"m11",text:"Chi cerca solo soldi facili è adatto a te?",type:"scale"},
{id:"m12",text:"Chi non vuole studiare può lavorare con te?",type:"scale"},
{id:"m13",text:"Chi non accetta disciplina è il tuo pubblico?",type:"scale"},
{id:"m14",text:"Chi vuole risultati immediati è compatibile con il tuo metodo?",type:"scale"},
{id:"m15",text:"Quali segnali ti fanno capire che qualcuno è davvero pronto?",type:"textarea"},
{id:"m16",text:"Quali segnali ti fanno capire che non è ancora il momento?",type:"textarea"},
]},
{title:"La trasformazione che offri",icon:"🦋",questions:[
{id:"m17",text:"Il tuo studente ideale arriva confuso?",type:"scale"},
{id:"m18",text:"Arriva spaventato?",type:"scale"},
{id:"m19",text:"Arriva motivato ma senza direzione?",type:"scale"},
{id:"m20",text:"Arriva deluso da esperienze precedenti?",type:"scale"},
{id:"m21",text:"Arriva pieno di dubbi su sé stesso?",type:"scale"},
{id:"m22",text:"Da quale punto parte il tuo studente ideale?",type:"textarea"},
{id:"m23",text:"Che cambiamento concreto può ottenere lavorando con te?",type:"textarea"},
{id:"m24",text:"In cosa diventa diverso rispetto a prima?",type:"textarea"},
]},
{title:"Il tuo stile comunicativo",icon:"🗣️",questions:[
{id:"m25",text:"Usi spiegazioni semplici, zero gergo tecnico?",type:"scale"},
{id:"m26",text:"Usi esempi pratici e concreti?",type:"scale"},
{id:"m27",text:"Usi storie vere e esperienze personali?",type:"scale"},
{id:"m28",text:"Sei diretto e senza giri di parole?",type:"scale"},
{id:"m29",text:"Punti sulla motivazione e l'incoraggiamento?",type:"scale"},
{id:"m30",text:"Usi sfide e provocazioni costruttive?",type:"scale"},
{id:"m31",text:"Vuoi far sentire i tuoi studenti compresi?",type:"scale"},
{id:"m32",text:"Vuoi farli sentire sfidati?",type:"scale"},
{id:"m33",text:"Vuoi farli sentire responsabilizzati?",type:"scale"},
]},
{title:"Identikit finale",icon:"📋",questions:[
{id:"m34",text:"Il mio studente ideale è un ragazzo/a di...",type:"textarea",placeholder:"età, situazione, carattere..."},
{id:"m35",text:"Oggi si sente...",type:"textarea",placeholder:"confuso, bloccato, motivato ma perso..."},
{id:"m36",text:"Desidera...",type:"textarea",placeholder:"libertà, competenza, una guida..."},
{id:"m37",text:"Ha paura di...",type:"textarea",placeholder:"fallire, perdere soldi, non farcela..."},
{id:"m38",text:"Grazie a me può trasformarsi in una persona che...",type:"textarea",placeholder:"ha disciplina, legge il mercato, crede in sé..."},
]},
];

let st={step:-1,ans:{},cmt:{},name:"",openCmt:{}};
const ap=document.getElementById("app");

function rp(){if(st.step===-1)ri();else if(st.step===S.length)rt();else rw();}

function ri(){
let tg=S.map(s=>`<span class="tag">${s.icon} ${s.title}</span>`).join("");
ap.innerHTML=`<div class="ctn" style="text-align:center;padding-top:56px">
<div style="font-size:48px;margin-bottom:16px">🧠</div>
<h1 class="pur">Conosci il tuo studente ideale</h1>
<p class="sub">Un'autoanalisi per definire con chi lavori meglio, che trasformazione offri e come comunicare nel modo giusto. Ci vogliono circa 5 minuti.</p>
<div style="margin:32px 0;text-align:left">
<label class="qlbl">Il tuo nome</label>
<input type="text" class="ni" id="ni" placeholder="Il tuo nome..." value="${st.name}">
</div>
<div style="text-align:left;margin-bottom:32px">${tg}</div>
<button class="bst" onclick="go()">Inizia →</button>
</div>`;}

function rw(){
const sec=S[st.step];const il=st.step===S.length-1;
let qs=sec.questions.map(q=>{
let cmtHtml="";
if(q.type!=="textarea"){
const isOpen=st.openCmt[q.id];
const cmtVal=st.cmt[q.id]||"";
if(isOpen||cmtVal){
cmtHtml=`<textarea class="cmt" rows="2" id="cmt_${q.id}" placeholder="Aggiungi un commento..." oninput="ci('${q.id}',this.value)">${cmtVal}</textarea>`;
}else{
cmtHtml=`<span class="cmt-toggle" onclick="oc('${q.id}')">+ Vuoi aggiungere qualcosa?</span>`;
}}
return`<div style="margin-bottom:24px">
<label class="qlbl">${q.text}</label>${rq(q)}${cmtHtml}</div>`;}).join("");
ap.innerHTML=`<div class="ctn wiz">
<div style="display:flex;justify-content:space-between;margin-bottom:8px">
<span style="color:#666;font-size:13px">🧠 ${st.name||"Mentore"}</span>
<span style="color:#666;font-size:13px">${st.step+1}/${S.length}</span></div>
<div class="pbar-w"><div class="pbar" style="width:${((st.step+1)/S.length)*100}%"></div></div>
<div class="fi" style="margin-top:32px">
<div style="display:flex;align-items:center;gap:12px;margin-bottom:28px">
<span style="font-size:32px">${sec.icon}</span>
<h2 class="stitle">${sec.title}</h2></div>${qs}</div>
<div class="nav">
<button class="bbk" onclick="pv()">← Indietro</button>
${il?`<button class="bsn" id="sb" onclick="snd()">✓ Invia le risposte</button>`
:`<button class="bnx" onclick="nx()">Avanti →</button>`}</div>
<div class="et" id="et">Errore nell'invio. Riprova tra qualche secondo.</div>
</div>`;}

function rq(q){
if(q.type==="scale"){return`<div class="sr">${SL.map((l,i)=>{
const v=i+1,a=st.ans[q.id]===v,c=SC[i];
return`<button class="sb" style="${a?`border:2.5px solid ${c.b};background:${c.bg}`:""}" onclick="ss('${q.id}',${v})">
<span class="n" style="${a?`color:${c.t}`:""}">${v}</span>
<span class="l" style="${a?`color:${c.t}`:""}">${l}</span></button>`;}).join("")}</div>`;}
if(q.type==="select"){return q.options.map(o=>{const a=st.ans[q.id]===o;
return`<button class="selbtn${a?" a":""}" onclick="sl('${q.id}','${o.replace(/'/g,"\\'")}')">${o}</button>`;}).join("");}
if(q.type==="textarea"){const v=st.ans[q.id]||"";
return`<textarea class="ans" rows="3" id="ta_${q.id}" placeholder="${q.placeholder||'Scrivi qui la tua risposta...'}" oninput="ti('${q.id}',this.value)">${v}</textarea>`;}
return"";}

function rt(){
ap.innerHTML=`<div class="ty"><div style="max-width:500px">
<div style="font-size:64px;margin-bottom:24px">🧠</div>
<h1 style="font-family:'Playfair Display',serif;font-size:28px;font-weight:800;color:#a855f7;margin-bottom:16px">Autoanalisi completata!</h1>
<p style="color:#aaa;font-size:16px;line-height:1.6">Le tue risposte sono state salvate e inviate. Ora hai un quadro più chiaro di chi è il tuo studente ideale e come puoi aiutarlo.</p>
<div style="margin-top:32px;width:60px;height:3px;background:linear-gradient(90deg,#a855f7,#4caf50);border-radius:99px;margin:32px auto 0"></div>
</div></div>`;}

function ti(id,v){st.ans[id]=v;}
function ci(id,v){st.cmt[id]=v;}
function ss(id,v){st.ans[id]=v;saveta();rp();}
function sl(id,v){st.ans[id]=v;saveta();rp();}
function oc(id){st.openCmt[id]=true;saveta();rp();setTimeout(()=>{const el=document.getElementById("cmt_"+id);if(el)el.focus();},50);}

function saveta(){
document.querySelectorAll("textarea.ans").forEach(t=>{const id=t.id.replace("ta_","");if(id)st.ans[id]=t.value;});
document.querySelectorAll("textarea.cmt").forEach(t=>{const id=t.id.replace("cmt_","");if(id)st.cmt[id]=t.value;});
}

function go(){st.name=document.getElementById("ni").value;st.step=0;rp();window.scrollTo(0,0);}
function nx(){saveta();st.step++;rp();window.scrollTo(0,0);}
function pv(){saveta();if(st.step>0)st.step--;else st.step=-1;rp();window.scrollTo(0,0);}

function gr(){
let x="QUESTIONARIO MENTORE - "+(st.name||"Anonimo")+"\n";
x+="Data: "+new Date().toLocaleDateString("it-IT")+"\n";
x+="==================================================\n\n";
S.forEach(sec=>{x+=sec.icon+" "+sec.title.toUpperCase()+"\n";
x+="--------------------------------------------\n";
sec.questions.forEach(q=>{const v=st.ans[q.id];const cm=st.cmt[q.id];
if(q.type==="scale"){const f=v||0;const b="#".repeat(f)+".".repeat(5-f);
const l=v?SL[v-1]:"(nessuna risposta)";
x+=q.text+"\n  ["+b+"] "+(v||"-")+"/5 - "+l+"\n";
}else{x+=q.text+"\n  -> "+(v||"(nessuna risposta)")+"\n";}
if(cm)x+="  Commento: "+cm+"\n";
x+="\n";});x+="\n";});return x;}

async function snd(){
saveta();const b=document.getElementById("sb");
b.textContent="Invio in corso...";b.disabled=true;b.style.background="#555";b.style.cursor="wait";
try{await emailjs.send(C.s,C.t,{section_title:"Mentore - "+(st.name||"Anonimo"),results:gr()},C.p);
st.step=S.length;rp();
}catch(e){console.error("EmailJS error:",e);
document.getElementById("et").style.display="block";
b.textContent="✓ Invia le risposte";b.disabled=false;
b.style.background="linear-gradient(135deg,#4caf50,#388e3c)";b.style.cursor="pointer";
setTimeout(()=>{document.getElementById("et").style.display="none";},4000);}}

rp();
</script>
</body>
</html>
