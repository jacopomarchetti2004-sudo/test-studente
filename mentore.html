<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conosci il tuo studente ideale</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f0f0f; color: #e8e8e8; font-family: 'DM Sans', sans-serif; min-height: 100vh; }
.container { max-width: 580px; margin: 0 auto; padding: 32px 24px; }
.container.wizard { padding-bottom: 140px; }
h1.purple { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 800; background: linear-gradient(135deg, #a855f7, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; line-height: 1.2; }
h2.section-title { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 800; color: #f0f0f0; }
.subtitle { color: #888; font-size: 15px; max-width: 420px; margin: 0 auto; line-height: 1.6; }
.progress-wrap { width: 100%; background: rgba(255,255,255,0.08); border-radius: 99px; height: 6px; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, #c084fc, #a855f7); border-radius: 99px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }
.question-label { display: block; font-size: 15px; font-weight: 600; color: #ddd; margin-bottom: 10px; line-height: 1.4; }
.scale-row { display: flex; gap: 6px; width: 100%; }
.scale-btn { flex: 1; padding: 14px 4px 10px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.2s; }
.scale-btn .num { font-size: 22px; font-weight: 800; color: #555; font-family: 'DM Sans', sans-serif; }
.scale-btn .lbl { font-size: 10px; color: #666; font-family: 'DM Sans', sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
.select-btn { display: block; width: 100%; padding: 12px 18px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #ccc; cursor: pointer; text-align: left; font-size: 15px; font-family: 'DM Sans', sans-serif; transition: all 0.2s; margin-bottom: 8px; }
.select-btn.active { border: 2px solid #a855f7; background: rgba(168,85,247,0.15); color: #c084fc; }
textarea.answer { width: 100%; padding: 16px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #e0e0e0; font-size: 15px; font-family: 'DM Sans', sans-serif; resize: vertical; outline: none; }
textarea.answer:focus { border-color: #a855f7; }
input.name-input { width: 100%; padding: 16px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #e0e0e0; font-size: 16px; font-family: 'DM Sans', sans-serif; outline: none; }
input.name-input:focus { border-color: #a855f7; }
.nav-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px 24px; background: linear-gradient(transparent, #0f0f0f 30%); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
.btn-back { padding: 14px 28px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); color: #ccc; cursor: pointer; font-size: 15px; font-weight: 600; font-family: 'DM Sans', sans-serif; }
.btn-next { padding: 14px 32px; border-radius: 12px; border: none; background: linear-gradient(135deg, #a855f7, #7c3aed); color: #fff; cursor: pointer; font-size: 15px; font-weight: 700; font-family: 'DM Sans', sans-serif; box-shadow: 0 4px 20px rgba(168,85,247,0.25); }
.btn-send { padding: 14px 32px; border-radius: 12px; border: none; background: linear-gradient(135deg, #4caf50, #388e3c); color: #fff; cursor: pointer; font-size: 15px; font-weight: 700; font-family: 'DM Sans', sans-serif; box-shadow: 0 4px 20px rgba(76,175,80,0.3); }
.btn-start { width: 100%; padding: 16px 32px; border-radius: 14px; border: none; background: linear-gradient(135deg, #a855f7, #7c3aed); color: #fff; cursor: pointer; font-size: 16px; font-weight: 700; font-family: 'DM Sans', sans-serif; box-shadow: 0 4px 24px rgba(168,85,247,0.3); }
.tag { padding: 8px 14px; border-radius: 99px; background: rgba(168,85,247,0.08); border: 1px solid rgba(168,85,247,0.15); color: #b388ff; font-size: 13px; display: inline-block; margin: 0 4px 8px 0; }
.fade-in { animation: fadeUp 0.35s ease forwards; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.error-toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(239,83,80,0.9); color: #fff; padding: 12px 24px; border-radius: 12px; font-size: 14px; z-index: 200; display: none; }
.thank-you { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 32px; }
</style>
</head>
<body>

<div id="app"></div>

<script>
const CONFIG = {
  serviceId: "service_333vq8h",
  templateId: "template_14jkmvg",
  publicKey: "Ho9TKfiAcFDFDgQhk"
};

const SCALE_LABELS = ["No", "Poco", "Così così", "Abbastanza", "Sì, molto"];
const SCALE_COLORS = [
  { bg: "rgba(239,83,80,0.15)", border: "#ef5350", text: "#ef5350" },
  { bg: "rgba(255,167,38,0.15)", border: "#ffa726", text: "#ffa726" },
  { bg: "rgba(255,238,88,0.12)", border: "#c9b458", text: "#c9b458" },
  { bg: "rgba(102,187,106,0.15)", border: "#66bb6a", text: "#66bb6a" },
  { bg: "rgba(76,175,80,0.2)", border: "#4caf50", text: "#4caf50" },
];

const SECTIONS = [
  { title: "Con chi lavori meglio", icon: "🤝", questions: [
    { id: "m1", text: "Ti trovi bene a lavorare con persone giovani (14-20)?", type: "scale" },
    { id: "m2", text: "Ti trovi bene con giovani adulti (20-30)?", type: "scale" },
    { id: "m3", text: "Ti trovi bene con adulti (30+)?", type: "scale" },
    { id: "m4", text: "Lavori bene con persone molto ambiziose?", type: "scale" },
    { id: "m5", text: "Lavori bene con persone insicure che hanno bisogno di fiducia?", type: "scale" },
    { id: "m6", text: "Preferisci principianti assoluti?", type: "scale" },
    { id: "m7", text: "Preferisci chi ha già iniziato ma è confuso?", type: "scale" },
    { id: "m8", text: "Ripensando a come eri qualche anno fa, che tipo di persona ti rivedi oggi nei tuoi studenti?", type: "textarea" },
    { id: "m9", text: "Quale tipo di persona ti dà energia?", type: "textarea" },
    { id: "m10", text: "Quale tipo di persona ti toglie energia?", type: "textarea" },
  ]},
  { title: "Chi NON vuoi attirare", icon: "🚫", questions: [
    { id: "m11", text: "Chi cerca solo soldi facili è adatto a te?", type: "scale" },
    { id: "m12", text: "Chi non vuole studiare può lavorare con te?", type: "scale" },
    { id: "m13", text: "Chi non accetta disciplina è il tuo pubblico?", type: "scale" },
    { id: "m14", text: "Chi vuole risultati immediati è compatibile con il tuo metodo?", type: "scale" },
    { id: "m15", text: "Quali segnali ti fanno capire che qualcuno è davvero pronto?", type: "textarea" },
    { id: "m16", text: "Quali segnali ti fanno capire che non è ancora il momento?", type: "textarea" },
  ]},
  { title: "La trasformazione che offri", icon: "🦋", questions: [
    { id: "m17", text: "Il tuo studente ideale arriva confuso?", type: "scale" },
    { id: "m18", text: "Arriva spaventato?", type: "scale" },
    { id: "m19", text: "Arriva motivato ma senza direzione?", type: "scale" },
    { id: "m20", text: "Arriva deluso da esperienze precedenti?", type: "scale" },
    { id: "m21", text: "Arriva pieno di dubbi su sé stesso?", type: "scale" },
    { id: "m22", text: "Da quale punto parte il tuo studente ideale?", type: "textarea" },
    { id: "m23", text: "Che cambiamento concreto può ottenere lavorando con te?", type: "textarea" },
    { id: "m24", text: "In cosa diventa diverso rispetto a prima?", type: "textarea" },
  ]},
  { title: "Il tuo stile comunicativo", icon: "🗣️", questions: [
    { id: "m25", text: "Usi spiegazioni semplici, zero gergo tecnico?", type: "scale" },
    { id: "m26", text: "Usi esempi pratici e concreti?", type: "scale" },
    { id: "m27", text: "Usi storie vere e esperienze personali?", type: "scale" },
    { id: "m28", text: "Sei diretto e senza giri di parole?", type: "scale" },
    { id: "m29", text: "Punti sulla motivazione e l'incoraggiamento?", type: "scale" },
    { id: "m30", text: "Usi sfide e provocazioni costruttive?", type: "scale" },
    { id: "m31", text: "Vuoi far sentire i tuoi studenti compresi?", type: "scale" },
    { id: "m32", text: "Vuoi farli sentire sfidati?", type: "scale" },
    { id: "m33", text: "Vuoi farli sentire responsabilizzati?", type: "scale" },
  ]},
  { title: "Identikit finale", icon: "📋", questions: [
    { id: "m34", text: "Il mio studente ideale è un ragazzo/a di...", type: "textarea", placeholder: "età, situazione, carattere..." },
    { id: "m35", text: "Oggi si sente...", type: "textarea", placeholder: "confuso, bloccato, motivato ma perso..." },
    { id: "m36", text: "Desidera...", type: "textarea", placeholder: "libertà, competenza, una guida..." },
    { id: "m37", text: "Ha paura di...", type: "textarea", placeholder: "fallire, perdere soldi, non farcela..." },
    { id: "m38", text: "Grazie a me può trasformarsi in una persona che...", type: "textarea", placeholder: "ha disciplina, legge il mercato, crede in sé..." },
  ]},
];

let state = { step: -1, answers: {}, name: "" };
const app = document.getElementById("app");

function render() {
  if (state.step === -1) renderIntro();
  else if (state.step === SECTIONS.length) renderThankYou();
  else renderWizard();
}

function renderIntro() {
  let tags = SECTIONS.map(s => `<span class="tag">${s.icon} ${s.title}</span>`).join("");
  app.innerHTML = `
    <div class="container" style="text-align:center; padding-top:56px;">
      <div style="font-size:48px; margin-bottom:16px;">🧠</div>
      <h1 class="purple">Conosci il tuo studente ideale</h1>
      <p class="subtitle">Un'autoanalisi per definire con chi lavori meglio, che trasformazione offri e come comunicare nel modo giusto. Ci vogliono circa 5 minuti.</p>
      <div style="margin:32px 0; text-align:left;">
        <label class="question-label">Il tuo nome</label>
        <input type="text" class="name-input" id="nameInput" placeholder="Il tuo nome..." value="${state.name}">
      </div>
      <div style="text-align:left; margin-bottom:32px;">${tags}</div>
      <button class="btn-start" onclick="startQuiz()">Inizia →</button>
    </div>`;
}

function renderWizard() {
  const sec = SECTIONS[state.step];
  const isLast = state.step === SECTIONS.length - 1;
  let qs = sec.questions.map(q => `
    <div style="margin-bottom:24px;">
      <label class="question-label">${q.text}</label>
      ${renderQuestion(q)}
    </div>`).join("");

  app.innerHTML = `
    <div class="container wizard">
      <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
        <span style="color:#666; font-size:13px;">🧠 ${state.name || "Mentore"}</span>
        <span style="color:#666; font-size:13px;">${state.step + 1}/${SECTIONS.length}</span>
      </div>
      <div class="progress-wrap"><div class="progress-bar" style="width:${((state.step + 1) / SECTIONS.length) * 100}%"></div></div>
      <div class="fade-in" style="margin-top:32px;">
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:28px;">
          <span style="font-size:32px;">${sec.icon}</span>
          <h2 class="section-title">${sec.title}</h2>
        </div>
        ${qs}
      </div>
      <div class="nav-bar">
        <button class="btn-back" onclick="prevStep()">← Indietro</button>
        ${isLast
          ? `<button class="btn-send" id="sendBtn" onclick="sendResults()">✓ Invia le risposte</button>`
          : `<button class="btn-next" onclick="nextStep()">Avanti →</button>`}
      </div>
      <div class="error-toast" id="errorToast">Errore nell'invio. Riprova tra qualche secondo.</div>
    </div>`;
}

function renderQuestion(q) {
  if (q.type === "scale") {
    return `<div class="scale-row">${SCALE_LABELS.map((lbl, i) => {
      const val = i + 1;
      const active = state.answers[q.id] === val;
      const c = SCALE_COLORS[i];
      return `<button class="scale-btn" style="${active ? `border:2.5px solid ${c.border}; background:${c.bg};` : ""}" onclick="setAnswer('${q.id}', ${val})">
        <span class="num" style="${active ? `color:${c.text}` : ""}">${val}</span>
        <span class="lbl" style="${active ? `color:${c.text}` : ""}">${lbl}</span>
      </button>`;
    }).join("")}</div>`;
  }
  if (q.type === "select") {
    return q.options.map(opt => {
      const active = state.answers[q.id] === opt;
      return `<button class="select-btn ${active ? 'active' : ''}" onclick="setAnswer('${q.id}', '${opt.replace(/'/g, "\\'")}')">${opt}</button>`;
    }).join("");
  }
  if (q.type === "textarea") {
    return `<textarea class="answer" rows="3" placeholder="${q.placeholder || 'Scrivi qui la tua risposta...'}" oninput="setAnswer('${q.id}', this.value)">${state.answers[q.id] || ""}</textarea>`;
  }
  return "";
}

function renderThankYou() {
  app.innerHTML = `
    <div class="thank-you">
      <div style="max-width:500px;">
        <div style="font-size:64px; margin-bottom:24px;">🧠</div>
        <h1 style="font-family:'Playfair Display',serif; font-size:28px; font-weight:800; color:#a855f7; margin-bottom:16px;">Autoanalisi completata!</h1>
        <p style="color:#aaa; font-size:16px; line-height:1.6;">Le tue risposte sono state salvate e inviate. Ora hai un quadro più chiaro di chi è il tuo studente ideale e come puoi aiutarlo.</p>
        <div style="margin-top:32px; width:60px; height:3px; background:linear-gradient(90deg,#a855f7,#4caf50); border-radius:99px; margin:32px auto 0;"></div>
      </div>
    </div>`;
}

function setAnswer(id, val) { state.answers[id] = val; render(); }
function startQuiz() { state.name = document.getElementById("nameInput").value; state.step = 0; render(); window.scrollTo(0, 0); }
function nextStep() { state.step++; render(); window.scrollTo(0, 0); }
function prevStep() { if (state.step > 0) state.step--; else state.step = -1; render(); window.scrollTo(0, 0); }

function generateReport() {
  let text = "";
  SECTIONS.forEach(sec => {
    text += sec.icon + " " + sec.title.toUpperCase() + "\n";
    text += "--------------------------------------------\n";
    sec.questions.forEach(q => {
      const val = state.answers[q.id];
      if (q.type === "scale") {
        const filled = val || 0;
        const bar = "#".repeat(filled) + ".".repeat(5 - filled);
        const label = val ? SCALE_LABELS[val - 1] : "(nessuna risposta)";
        text += q.text + "\n  [" + bar + "] " + (val || "-") + "/5 - " + label + "\n\n";
      } else {
        text += q.text + "\n  -> " + (val || "(nessuna risposta)") + "\n\n";
      }
    });
    text += "\n";
  });
  return text;
}

async function sendResults() {
  const btn = document.getElementById("sendBtn");
  btn.textContent = "Invio in corso...";
  btn.disabled = true;
  btn.style.background = "#555";
  btn.style.cursor = "wait";

  try {
    await emailjs.send(CONFIG.serviceId, CONFIG.templateId, {
      section_title: "Mentore - " + (state.name || "Anonimo"),
      results: generateReport()
    }, CONFIG.publicKey);
    state.step = SECTIONS.length;
    render();
  } catch (e) {
    console.error("EmailJS error:", e);
    const toast = document.getElementById("errorToast");
    toast.style.display = "block";
    btn.textContent = "✓ Invia le risposte";
    btn.disabled = false;
    btn.style.background = "linear-gradient(135deg, #4caf50, #388e3c)";
    btn.style.cursor = "pointer";
    setTimeout(() => { toast.style.display = "none"; }, 4000);
  }
}

render();
</script>
</body>
</html>
